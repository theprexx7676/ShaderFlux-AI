name: Bug report
description: Something does not work as documented
labels: ["needs-repro"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get?
    validations:
      required: true
  - type: textarea
    id: shader
    attributes:
      label: Minimal shader
      description: The smallest shader that reproduces it. Do not paste proprietary or NDA-covered code.
      render: hlsl
  - type: textarea
    id: doctor
    attributes:
      label: Output of `shaderflux doctor --json`
      description: Not available yet? Paste your tool versions and OS instead.
      render: json
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
