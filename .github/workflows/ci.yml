name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-uv creates and activates a virtual environment when given a Python version,
      # so do not create another one (that was the failure in the first CI run).
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest -m "not needs_tools and not needs_llm and not needs_gpu" --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  # The tests that run the real shader tools (glslang, glslc, SPIRV-Cross, SPIRV-Tools).
  # Ubuntu only: the tools come from apt. There is no `dxc` here, so the DXC tests skip.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools glslang-tools spirv-cross glslc
          shaderflux_tools="spirv-val spirv-opt spirv-dis spirv-cross glslangValidator glslc"
          for tool in $shaderflux_tools; do command -v "$tool"; done
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: python -m shaderflux doctor
        continue-on-error: true  # dxc is expected to be missing (exit 1); this just logs the tool versions
      - run: python -m pytest -m "needs_tools and not needs_llm and not needs_gpu" -rs
