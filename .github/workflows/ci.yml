name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-uv creates and activates a virtual environment when given a Python version,
      # so do not create another one (that was the failure in the first CI run).
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest -m "not needs_tools and not needs_llm and not needs_gpu" --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  # The tests that run the real shader tools (glslang, glslc, SPIRV-Cross, SPIRV-Tools).
  # Ubuntu only: the tools come from apt. There is no `dxc` here, so the DXC tests skip.
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools glslang-tools spirv-cross glslc
          shaderflux_tools="spirv-val spirv-opt spirv-dis spirv-cross glslangValidator glslc"
          for tool in $shaderflux_tools; do command -v "$tool"; done
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: python -m shaderflux doctor
        continue-on-error: true  # dxc is expected to be missing (exit 1); this just logs the tool versions
      - run: python -m pytest -m "needs_tools and not needs_llm and not needs_gpu" -rs

  # Runs action.yml itself (not just the script it calls) on this repository's own shaders.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A clean shader passes
        uses: ./
        with:
          paths: "tests/corpus/lint/pbr_clean.hlsl"
          sarif-file: clean.sarif
      - name: A shader with a binding collision fails the job
        id: collision
        uses: ./
        continue-on-error: true
        with:
          paths: "tests/corpus/hlsl/collision.hlsl"
          sarif-file: collision.sarif
      - name: The previous step must have failed
        run: test "${{ steps.collision.outcome }}" = "failure"
      - name: Glob patterns work, and fail-on never never fails
        uses: ./
        with:
          paths: "tests/corpus/hlsl/*.hlsl tests/corpus/glsl/*.vert"
          fail-on: never
          sarif-file: all.sarif
      - name: The SARIF files are correct
        run: |
          python3 - <<'PY'
          import json
          clean = json.load(open("clean.sarif"))["runs"][0]["results"]
          collision = json.load(open("collision.sarif"))["runs"][0]["results"]
          everything = json.load(open("all.sarif"))["runs"][0]["results"]
          assert clean == [], clean
          assert any(r["ruleId"] == "BND001" for r in collision), collision
          assert len(everything) > len(collision), (len(everything), len(collision))
          print("clean:", len(clean), "collision:", len(collision), "all:", len(everything))
          PY

  # DXC is not in the Ubuntu archive, so download Microsoft's release. This is the only place the
  # HLSL path is exercised against a real DXC; it also records facts about DXC for the docs.
  # The HLSL path against real DXC builds: the newest release ("latest") and the newest release
  # of an older minor series by tag ("older", see scripts/ci_select_dxc.py; that release's binary
  # reports itself as 1.9 dev, so compare the `dxc --version` lines in the logs). The "latest" leg keeps the
  # exact check name `dxc-tests`, which the branch ruleset requires; the other leg is named
  # `dxc-tests (older)`.
  dxc-tests:
    name: ${{ matrix.dxc == 'latest' && 'dxc-tests' || format('dxc-tests ({0})', matrix.dxc) }}
    strategy:
      fail-fast: false
      matrix:
        dxc: [latest, older]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the other shader tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools glslang-tools spirv-cross glslc
      - name: Choose the DXC release
        id: dxc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/microsoft/DirectXShaderCompiler/releases?per_page=50" > "$RUNNER_TEMP/releases.json"
          python3 scripts/ci_select_dxc.py "${{ matrix.dxc }}" < "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT"
      - name: Install DXC from its GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dxc"
          gh release download "${{ steps.dxc.outputs.tag }}" --repo microsoft/DirectXShaderCompiler \
            --pattern "${{ steps.dxc.outputs.asset }}" --dir "$RUNNER_TEMP/dxc"
          ls -la "$RUNNER_TEMP/dxc"
          tar -xzf "$RUNNER_TEMP"/dxc/linux_dxc_*.tar.gz -C "$RUNNER_TEMP/dxc"
          find "$RUNNER_TEMP/dxc" -maxdepth 2 -not -name '*.tar.gz' | head -30
          echo "$RUNNER_TEMP/dxc/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/dxc/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - run: dxc --version
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - name: What shaderflux sees
        run: python -m shaderflux doctor --json
      - name: Facts about DXC (not a test; read when updating the docs)
        run: python scripts/dxc_experiments.py
      - name: Tests against the real DXC
        run: python -m pytest -m "needs_tools and not needs_llm and not needs_gpu" -rs -v tests/integration/test_dxc.py tests/integration/test_translate_e2e.py

  # A plain install must work without the optional AI support: no Anthropic SDK, and every
  # command that does not use the model still runs. `pip install` into a clean runner Python.
  lean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without any extra
        run: python -m pip install .
      - name: The AI client is not installed
        run: python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('anthropic') else 0)"
      - name: Commands that need no AI work
        run: |
          shaderflux --version
          shaderflux lint tests/corpus/lint/pbr_clean.hlsl
          shaderflux explain BND001
          shaderflux fix tests/corpus/lint/pbr_clean.hlsl --check
          shaderflux init "$RUNNER_TEMP/project"
      - name: --repair explains the extra and exits 2 without doing any work
        run: |
          set +e
          shaderflux translate tests/corpus/glsl/passthrough.vert --to hlsl --repair
          code=$?
          echo "exit code: $code"
          [ "$code" -eq 2 ]
      - name: --repair --dry-run still works (it needs a compiler to find the error)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-cross
          shaderflux translate tests/corpus/glsl/broken.frag --to hlsl --repair --dry-run 2>&1 | tee dry.txt
          grep -q "DRY RUN" dry.txt
