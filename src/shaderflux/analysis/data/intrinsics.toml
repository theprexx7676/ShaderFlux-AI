# HLSL <-> GLSL intrinsic mapping.
#
# Provenance: written from general knowledge and cross-checked against Microsoft's
# GLSL-to-HLSL reference (https://learn.microsoft.com/en-us/windows/uwp/gaming/glsl-to-hlsl-reference).
# `evidence` says how each *claim* was established:
#   verified   - observed in real SPIRV-Cross output during development
#   documented - stated in official documentation
#   unverified - believed correct, still to be checked (plan task 4.4.1)
#
# Only entries with `flag = true` produce lint findings. The rest are kept so that
# `shaderflux explain` and future prompts can show the mapping.

[[intrinsic]]
hlsl = "fmod"
glsl = "mod"
flag = true
rule = "INT001"
title = "fmod and mod round differently for negative numbers"
note = "HLSL fmod truncates toward zero; GLSL mod uses floor. They agree for positive values and differ for negative ones."
fix = "Use the one that matches the original behaviour. SPIRV-Cross emulates GLSL mod in HLSL as x - y * floor(x / y)."
evidence = "verified"

[[intrinsic]]
glsl = "inverse"
flag = true
rule = "INT002"
title = "inverse() has no HLSL intrinsic"
note = "HLSL has no matrix inverse intrinsic. SPIRV-Cross generates a helper (spvInverse, several dozen lines using determinants) once per shader."
fix = "Compute the inverse on the CPU and upload it as a constant when it does not change per pixel."
evidence = "verified"

[[intrinsic]]
hlsl = "round"
glsl = "round"
flag = true
rule = "INT003"
title = "round() halfway cases are not guaranteed to match"
note = "GLSL leaves halfway rounding implementation-dependent and offers roundEven for round-half-to-even; HLSL round behaviour for halves should be checked in its reference."
fix = "Use roundEven (GLSL) when the exact halfway behaviour matters, and test both sides."
evidence = "unverified"

